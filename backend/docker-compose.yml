version: '3.8'

services:

  mongo:
    image: mongo:7
    container_name: mongo_db
    command: ["--replSet", "rs0"]
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --eval "rs.status().ok" --quiet
      interval: 10s
      retries: 5
      start_period: 10s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo:27017 --eval "
        try { rs.status(); print('already initiated'); }
        catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); }
      "

volumes:
  mongo_data:
